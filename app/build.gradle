plugins { id 'com.android.application' }
android {
    namespace 'in.subtrack.app'
    compileSdk 35
    defaultConfig { applicationId 'in.subtrack.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    def signingPath = System.getenv('SUBTRACK_KEYSTORE')
    if (signingPath) {
        signingConfigs { release { storeFile file(signingPath); storePassword System.getenv('SUBTRACK_STORE_PASSWORD'); keyAlias System.getenv('SUBTRACK_KEY_ALIAS'); keyPassword System.getenv('SUBTRACK_KEY_PASSWORD') } }
    }
    buildTypes { release { minifyEnabled false; if (signingPath) signingConfig signingConfigs.release } }
}

