name: Build My Subscription Manager
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build.yml'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check subscription and earnings logic
        run: node tests/core.test.cjs
      - name: Verify mobile layout and encrypted backups
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tests" playwright@1.51.1
          "$RUNNER_TEMP/ui-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/ui-tests/node_modules" node tests/ui.test.cjs
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare private signing handoff
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/My-Subscription-Manager-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: My-Subscription-Manager-build
          path: output/
          retention-days: 1
          if-no-files-found: error
